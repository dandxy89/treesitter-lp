[package]
name = "tree-sitter-lp"
description = "Tree-sitter grammar for LP (Linear Programming) files"
version = "0.1.0"
authors = ["Dan"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "lp"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/dandxy89/treesitter-lp"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.2.56"

[dev-dependencies]
tree-sitter = "0.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.dev]
# macOS keeps unpacked debuginfo .o files forever in the shared target dir; keep them small.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
