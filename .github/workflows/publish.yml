name: Publish package

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: false # never abort a half-finished release

jobs:
  release:
    uses: tree-sitter/workflows/.github/workflows/release.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      generate: true

  crates:
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
    permissions:
      contents: read
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      # The repository is `treesitter-lp`; the crate is `tree-sitter-lp`.
      package-name: tree-sitter-lp
      # No `generate`: the committed parser is published as it is, and a
      # regenerated one would leave the tree dirty for `cargo publish`.
