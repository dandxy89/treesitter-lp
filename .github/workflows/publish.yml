name: Publish package

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: false # never abort a half-finished release

jobs:
  release:
    uses: tree-sitter/workflows/.github/workflows/release.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      generate: true
